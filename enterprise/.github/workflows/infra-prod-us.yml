name: Infra - Prod US (VPC + EKS)

on:
  pull_request:
    paths: ['enterprise/infra/prod-us/**', 'enterprise/modules/**']
  push:
    branches: [main]
    paths: ['enterprise/infra/prod-us/**', 'enterprise/modules/**']

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.0'
  ENVIRONMENT: prod-us

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise/infra/prod-us

    steps:
      - uses: actions/checkout@v4

      # OIDC auth — assumes role INTO prod-us account (not management account)
      - name: Configure AWS (OIDC - Prod US Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PROD_US_ACCOUNT_ID }}:role/terraform-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -var-file=../../environments/prod-us.tfvars -out=tfplan

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 🇺🇸 Prod-US Infrastructure Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Update Kubeconfig
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws eks update-kubeconfig --name $(terraform output -raw cluster_name) --region ${{ env.AWS_REGION }}
          kubectl get nodes
